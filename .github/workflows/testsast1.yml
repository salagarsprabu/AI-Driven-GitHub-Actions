name: 🔐 Security PR Scan (AI + Regex)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

env:
  GH_MODEL: "gpt-4o"               # Current GA model
  MODEL_TEMPERATURE: "0"
  BLOCK_ON_HIGH: "false"           # Set "true" to block merges

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep curl

      - name: Run Regex + AI Security Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔍 Running security scan on changed files..."

          BASE=${{ github.event.pull_request.base.ref }}
          git fetch origin $BASE:refs/remotes/origin/$BASE
          CHANGED_FILES=$(git diff --name-only origin/$BASE...HEAD)

          # --- Regex patterns ---
          HIGH_PATTERNS=(
            'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}'
            '[A-Za-z0-9/+=]{40}'
            '-----BEGIN (RSA|PRIVATE|EC|OPENSSH) PRIVATE KEY-----'
            "(password|passwd)[\"']?\s*[:=]\s*['\"].{3,}"
          )
          LOW_PATTERNS=(
            '\beval\(|\bexec\('
            'api[_-]?key|secret[_-]?key'
          )

          HIGH_FINDINGS=()
          LOW_FINDINGS=()
          AI_DIFF=""

          mask_secret() {
            echo "$1" | sed 's/[A-Za-z0-9]/X/g'
          }

          # --- Scan changed files and collect relevant lines for AI ---
          for file in $CHANGED_FILES; do
            [ -f "$file" ] || continue
            case "$file" in *.png|*.jpg|*.jpeg|*.gif|*.pdf|*.zip|*.bin) continue;; esac

            # Get only the added/modified lines
            DIFF_LINES=$(git diff origin/$BASE...HEAD -U0 -- "$file" | grep -E '^\+' | sed 's/^\+//')

            # Append to AI_DIFF for input
            if [ -n "$DIFF_LINES" ]; then
              AI_DIFF+="$file:\n$DIFF_LINES\n\n"
            fi

            # Regex scanning
            for pat in "${HIGH_PATTERNS[@]}"; do
              matches=$(rg --no-filename -n --pcre2 "$pat" "$file" 2>/dev/null || true)
              while IFS=: read -r line match; do
                [ -n "$line" ] && HIGH_FINDINGS+=("$file:$line — $(mask_secret "$match")")
              done <<< "$matches"
            done

            for pat in "${LOW_PATTERNS[@]}"; do
              matches=$(rg --no-filename -n --pcre2 "$pat" "$file" 2>/dev/null || true)
              while IFS=: read -r line match; do
                [ -n "$line" ] && LOW_FINDINGS+=("$file:$line — $(mask_secret "$match")")
              done <<< "$matches"
            done
          done

          # --- AI-assisted check using only relevant changed lines ---
          SYSTEM_PROMPT="You are a strict code security reviewer. Analyze the following added/modified lines for potential security risks like secrets, insecure auth, injections, or unsafe logic. Summarize findings in plain English. If no risk, respond with 'NO_RISK'."
          AI_OUT=$(gh api -X POST /models/${{ env.GH_MODEL }}/responses \
            -f input="$SYSTEM_PROMPT\n\n$AI_DIFF" \
            -f temperature=${{ env.MODEL_TEMPERATURE }} \
            --jq '.output_text' 2>/dev/null || echo "NO_RISK")
          AI_OUT=${AI_OUT:-NO_RISK}

          # --- Build Markdown comment with summary table ---
          NUM_HIGH=${#HIGH_FINDINGS[@]}
          NUM_LOW=${#LOW_FINDINGS[@]}

          COMMENT="### 🔐 Automated Security Scan Results\n\n"
          COMMENT+="| Severity | Findings |\n"
          COMMENT+="|----------|----------|\n"
          COMMENT+="| 🚨 High  | $NUM_HIGH |\n"
          COMMENT+="| ⚠️ Low   | $NUM_LOW |\n\n"

          COMMENT+="**🧠 AI Findings:**\n"
          if [[ "$AI_OUT" == "NO_RISK" ]]; then
            COMMENT+="- None detected by AI model.\n\n"
          else
            COMMENT+="\`\`\`\n$AI_OUT\n\`\`\`\n\n"
          fi

          COMMENT+="**🚨 Regex High Severity:**\n"
          if [ $NUM_HIGH -eq 0 ]; then
            COMMENT+="- None\n"
          else
            for f in "${HIGH_FINDINGS[@]}"; do COMMENT+="- \`$f\`\n"; done
          fi
          COMMENT+="\n"

          COMMENT+="**⚠️ Regex Low Severity:**\n"
          if [ $NUM_LOW -eq 0 ]; then
            COMMENT+="- None\n"
          else
            for f in "${LOW_FINDINGS[@]}"; do COMMENT+="- \`$f\`\n"; done
          fi
          COMMENT+="\n---\n*Generated by automated SAST + AI review.*"

          # --- Post to PR as comment ---
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"

          # --- Optional blocking policy ---
          if [ "${{ env.BLOCK_ON_HIGH }}" = "true" ] && [ $NUM_HIGH -gt 0 ]; then
            echo "::error ::Blocking PR due to high-severity findings."
            exit 1
          fi
